<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pied de page du site Pulse</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<footer style="position: relative; overflow: hidden; background: {{bg}}; font-family: 'Instrument Sans', system-ui, sans-serif; color: {{fg}}">
  <svg aria-hidden="true" viewBox="0 0 1440 60" preserveAspectRatio="none" style="display: block; width: 100%; height: 60px"><path d="M0 34 H610 L628 34 L640 12 L656 54 L670 22 L680 34 H1440" fill="none" stroke="{{line}}" stroke-width="1.5"></path><path d="M610 34 L628 34 L640 12 L656 54 L670 22 L680 34" fill="none" stroke="#C8161D" stroke-width="1.8" stroke-linejoin="round"></path></svg>
  <div style="position: relative; max-width: 1200px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 40px) 28px; display: flex; flex-direction: column; gap: 40px">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <span style="display: flex; align-items: center; gap: 10px">
          <svg width="30" height="17" viewBox="240 350 560 324" aria-hidden="true"><path fill="#D91E25" d="M245 480C300 474 330 445 360 420C410 378 465 356 520 354L520 511C465 513 410 535 360 577C330 602 300 631 245 637ZM520 512C575 506 605 477 635 452C685 410 740 388 795 386L795 543C740 545 685 567 635 609C605 634 575 663 520 669Z"></path></svg>
          <span style="font-family: 'Bricolage Grotesque', Arial, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.03em">Pulse</span>
        </span>
        <p style="margin: 0; font-size: 14px; line-height: 1.6; color: {{muted}}">Base FiveM pour serveurs RP.</p>
      </div>
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="4">
        <nav aria-label="{{c.title}}" style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 14px; font-weight: 600">{{c.title}}</span>
          <sc-for list="{{c.links}}" as="l" hint-placeholder-count="4"><a href="{{l.href}}" style="color: {{muted}}; font-size: 14px; text-decoration: none">{{l.label}}</a></sc-for>
        </nav>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 22px; border-top: 1px solid {{line}}; font-size: 13px; color: {{muted}}">
      <span>© 2026 Pulse. Pulse n’est pas affilié à Rockstar Games ni à Cfx.re.</span>
      <a href="Admin-Dashboard.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 32px; color: {{muted}}; font-size: 12.5px; text-decoration: none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg>
        Administration
      </a>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    const light = (this.props.theme ?? 'dark') === 'light';
    const P = light
      ? { bg: '#EFEDE9', fg: '#16151A', muted: '#5E5B63', line: '#D9D5CE' }
      : { bg: '#0B0B0C', fg: '#ECEBE8', muted: '#A3A2A6', line: '#2A2A2F' };
    const L = (label, href) => ({ label, href });
    return {
      ...P,
      cols: [
        { title: 'Produit', links: [L('Fonctionnalités', 'Site-Fonctionnalites.dc.html'), L('Tarifs', 'Site-Tarifs.dc.html'), L('Avis', 'Site-Avis.dc.html'), L('FAQ', 'Site-FAQ.dc.html')] },
        { title: 'Espace client', links: [L('Se connecter', 'Main.dc.html'), L('Téléchargements', 'Client-Licence.dc.html#telechargements'), L('Support', 'Client-Support.dc.html')] },
        { title: 'Communauté', links: [L('Discord', 'Site-Discord.dc.html'), L('Serveur de test', 'Site-Discord.dc.html#serveur-test'), L('YouTube', 'Site-Discord.dc.html#youtube')] },
        { title: 'Légal', links: [L('Mentions légales', '#mentions'), L('CGV', '#cgv'), L('Confidentialité', '#confidentialite')] }
      ]
    };
  }
}
</script>
</body>
</html>

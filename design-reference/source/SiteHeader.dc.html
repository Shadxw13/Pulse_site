<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>En-tête du site Pulse</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="position: sticky; top: 0; z-index: 20; background: {{bg}}; border-bottom: 1px solid {{line}}; font-family: 'Instrument Sans', system-ui, sans-serif; color: {{fg}}; backdrop-filter: blur(10px)">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 20px">
    <a href="Site-Accueil.dc.html" style="display: flex; align-items: center; gap: 10px; color: {{fg}}; text-decoration: none">
      <svg width="30" height="17" viewBox="240 350 560 324" aria-hidden="true"><path fill="#D91E25" d="M245 480C300 474 330 445 360 420C410 378 465 356 520 354L520 511C465 513 410 535 360 577C330 602 300 631 245 637ZM520 512C575 506 605 477 635 452C685 410 740 388 795 386L795 543C740 545 685 567 635 609C605 634 575 663 520 669Z"></path></svg>
      <span style="font-family: 'Bricolage Grotesque', Arial, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.03em; line-height: 1">Pulse</span>
    </a>

    <sc-if value="{{wide}}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Navigation principale" style="display: flex; align-items: center; gap: 28px">
        <sc-for list="{{links}}" as="l" hint-placeholder-count="6">
          <a href="{{l.href}}" aria-current="{{l.current}}" style="display: inline-flex; align-items: center; min-height: 44px; color: {{l.color}}; font-size: 14.5px; font-weight: {{l.weight}}; text-decoration: none; box-shadow: {{l.bar}}">{{l.label}}</a>
        </sc-for>
      </nav>
    </sc-if>

    <div style="display: flex; align-items: center; gap: 8px">
      <sc-if value="{{wide}}" hint-placeholder-val="{{ true }}">
        <a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px; color: {{fg}}; font-size: 14px; text-decoration: none">Se connecter</a>
      </sc-if>
      <a href="Site-Tarifs.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 999px; background: {{ctaBg}}; color: {{ctaFg}}; font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap">Voir les offres</a>
      <sc-if value="{{compact}}" hint-placeholder-val="{{ false }}">
        <button type="button" aria-label="{{menuLabel}}" aria-expanded="{{menuExpanded}}" onClick="{{toggleMenu}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid {{line}}; background: transparent; color: {{fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{menuIcon}}"></path></svg>
        </button>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{menuShown}}" hint-placeholder-val="{{ false }}">
    <nav aria-label="Navigation principale" style="display: flex; flex-direction: column; padding: 8px clamp(16px, 4vw, 40px) 18px; border-top: 1px solid {{line}}">
      <sc-for list="{{links}}" as="l" hint-placeholder-count="6">
        <a href="{{l.href}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-bottom: 1px solid {{line}}; color: {{fg}}; font-size: 17px; font-weight: 600; text-decoration: none">{{l.label}}<span style="opacity: .5">›</span></a>
      </sc-for>
      <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 16px; border-radius: 999px; border: 1px solid {{line}}; color: {{fg}}; font-size: 15px; font-weight: 600; text-decoration: none">Se connecter</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["accueil","fonctionnalites","tarifs","avis","faq","discord"],"default":"accueil"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":70}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { compact: false, open: false };
    this.onResize = () => {
      const compact = window.innerWidth < 900;
      if (compact !== this.state.compact) this.setState({ compact, open: false });
    };
  }
  componentDidMount() { this.onResize(); window.addEventListener('resize', this.onResize); }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const active = this.props.active ?? 'accueil';
    const light = (this.props.theme ?? 'dark') === 'light';
    const P = light
      ? { bg: 'rgba(245, 244, 241, 0.86)', fg: '#16151A', muted: '#57545C', line: '#E3E0DA', ctaBg: '#16151A', ctaFg: '#FFFFFF' }
      : { bg: 'rgba(11, 11, 12, 0.94)', fg: '#ECEBE8', muted: '#C9C8C4', line: '#1C1C1F', ctaBg: '#C8161D', ctaFg: '#FFFFFF' };
    const compact = this.state.compact;
    const open = compact && this.state.open;
    const links = [
      ['accueil', 'Accueil', 'Site-Accueil.dc.html'],
      ['fonctionnalites', 'Fonctionnalités', 'Site-Fonctionnalites.dc.html'],
      ['tarifs', 'Tarifs', 'Site-Tarifs.dc.html'],
      ['avis', 'Avis', 'Site-Avis.dc.html'],
      ['faq', 'FAQ', 'Site-FAQ.dc.html'],
      ['discord', 'Discord', 'Site-Discord.dc.html']
    ].map(([key, label, href]) => {
      const on = key === active;
      return { label, href, current: on ? 'page' : 'false', color: on ? P.fg : P.muted, weight: on ? '600' : '500', bar: on ? 'inset 0 -1px 0 ' + P.fg : 'none' };
    });
    return {
      ...P, links, wide: !compact, compact,
      menuShown: open, menuExpanded: open ? 'true' : 'false',
      menuLabel: open ? 'Fermer le menu' : 'Ouvrir le menu',
      menuIcon: open ? 'M6 6l12 12M18 6L6 18' : 'M4 7h16M4 12h16M4 17h16',
      toggleMenu: () => this.setState({ open: !this.state.open })
    };
  }
}
</script>
</body>
</html>

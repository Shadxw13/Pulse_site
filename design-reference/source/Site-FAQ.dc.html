<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>FAQ · Pulse</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Barlow+Semi+Condensed:wght@500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F4F1}
*{box-sizing:border-box}
a{color:inherit;text-underline-offset:4px}
.site{position:relative;background:#F5F4F1;color:#16151A;font:400 16px/1.6 'Instrument Sans',system-ui,sans-serif;overflow-x:clip}
.site a.btn{text-decoration:none}
.wrap{position:relative;max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.sec{position:relative;padding:clamp(64px,8vw,112px) 0}
.ey{display:inline-flex;align-items:center;gap:10px;font:500 13.5px/1.4 'Instrument Sans',system-ui,sans-serif;color:#67646C}
.ey::before{content:"";width:18px;height:2px;border-radius:2px;background:#C8161D}
.h1,.h2,.h3{margin:0;font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:700;text-wrap:balance;font-variation-settings:"opsz" 96}
.h1{font-size:clamp(40px,5.8vw,76px);line-height:.98;letter-spacing:-.04em}
.h2{font-size:clamp(30px,3.8vw,50px);line-height:1.02;letter-spacing:-.035em}
.h3{font-size:21px;line-height:1.2;letter-spacing:-.02em}
.lead{margin:0;font-size:17px;line-height:1.6;color:#3E3C43;max-width:58ch}
.muted{color:#67646C}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font:500 15px/1 'Instrument Sans',system-ui,sans-serif;border:1px solid #D3CFC7;background:#FFFFFF;color:#16151A;white-space:nowrap;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.btn:hover{border-color:#16151A}
.btn-sm{min-height:40px;padding:0 16px;font-size:14px}
.btn-red{background:#C8161D;border-color:#C8161D;color:#FFFFFF}.btn-red:hover{background:#A91219;border-color:#A91219}
.btn-ink{background:#16151A;border-color:#16151A;color:#FFFFFF}.btn-ink:hover{background:#2C2A31;border-color:#2C2A31}
.btn-discord{background:#16151A;border-color:#16151A;color:#FFFFFF}.btn-discord:hover{background:#2C2A31;border-color:#2C2A31}
.card{background:#FFFFFF;border:1px solid #E3E0DA;border-radius:18px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;background:#ECEAE5;color:#3E3C43}
.tag-red{background:#FBEAEA;color:#A8121A}
.rise{animation:rise .8s cubic-bezier(.2,.75,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@supports (animation-timeline: view()){
  .rv{animation:rvin linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
  @keyframes rvin{from{opacity:0;transform:translateY(36px)}}
}
:focus-visible{outline:2px solid #16151A;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.rise,.rv{animation:none!important}}

.cat{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid #D3CFC7;background:#FFFFFF;color:#3E3C43;font:500 14px 'Instrument Sans',system-ui,sans-serif;cursor:pointer}
.cat[aria-pressed="true"]{background:#16151A;border-color:#16151A;color:#FFFFFF}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:18px 22px;border:0;background:transparent;color:#16151A;font:600 16.5px/1.4 'Instrument Sans',system-ui,sans-serif;text-align:left;cursor:pointer}
.sign{width:32px;height:32px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;transition:transform .25s,background .2s}
</style>
</helmet>
<div class="site">
  <dc-import name="SiteHeader" active="faq" theme="light" hint-size="100%,69px"></dc-import>

  <section style="padding: clamp(56px, 8vw, 104px) 0 clamp(64px, 8vw, 104px)">
    <div class="wrap" style="display: flex; flex-wrap: wrap; gap: clamp(32px, 5vw, 64px); align-items: flex-start">
      <div class="rise" style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 24px">
        <span class="ey">FAQ</span>
        <h1 class="h1">Questions fréquentes.</h1>
        <p class="lead" style="font-size: 16px">Pas trouvé votre réponse ? L’équipe répond sur le Discord, par ticket.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><button type="button" class="cat" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div>
        <div style="padding-top: 8px"><a class="btn btn-discord" href="Site-Discord.dc.html">Poser une question</a></div>
      </div>
      <div style="flex: 1.6 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{items}}" as="f" hint-placeholder-count="8">
          <div style="border-radius: 16px; background: #FFFFFF; border: 1px solid {{f.border}}; transition: border-color .2s">
            <button type="button" class="faq-q" aria-expanded="{{f.expanded}}" onClick="{{f.toggle}}">
              <span style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12.5px; font-weight: 500; color: #67646C">{{f.cat}}</span>{{f.q}}</span>
              <span class="sign" aria-hidden="true" style="background: {{f.sBg}}; color: {{f.sFg}}; border: 1px solid {{f.sBd}}; transform: rotate({{f.rot}}deg)">+</span>
            </button>
            <sc-if value="{{f.open}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 0 22px 22px; font-size: 15.5px; line-height: 1.65; color: #3E3C43">{{f.a}}</p></sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" theme="light" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: 0, cat: 'tout' }; }
  renderVals() {
    const all = [
      ['La base', 'Pourquoi nous faire confiance pour votre serveur ?', 'L’équipe Pulse est composée de développeurs et de sysadmins passés par les plus gros serveurs de la scène. Des projets qui tournent entre 600 et 1000 joueurs simultanés. Aucune ressource leakée ni mal optimisée. Tout est pensé et testé en conditions réelles avant d’arriver entre vos mains.'],
      ['La base', 'Comment se passe la prise en main après l’achat ?', 'Vous recevez un accès direct aux fichiers de la base dès la validation de votre commande. La documentation vous guide pas à pas dans l’installation.'],
      ['La base', 'Puis-je tester la base avant d’acheter ?', 'Oui, le serveur de test est ouvert à tous. Les informations de connexion sont sur la page Discord du site.'],
      ['Commande', 'Comment acheter ?', 'Rejoignez le Discord, ouvrez un ticket depuis le salon boutique et choisissez votre formule. Vous payez par PayPal, l’équipe valide le paiement, puis votre licence vous est envoyée en message privé.'],
      ['Commande', 'Comment passer d’un abonnement mensuel à la licence Lifetime ?', 'Ouvrez un ticket et nous ajustons l’offre. Le passage reste possible à tout moment.'],
      ['Licence', 'Sur combien de serveurs puis-je utiliser ma licence ?', 'Une licence correspond à un serveur. L’adresse IP autorisée se change depuis votre espace client.'],
      ['Licence', 'Que se passe-t-il si mon abonnement mensuel expire ?', 'Vous recevez un rappel avant l’échéance. Sans renouvellement, la licence est suspendue jusqu’au prochain paiement.'],
      ['Support', 'En quoi consiste le Support Premium inclus en Lifetime ?', 'Vos demandes passent en priorité. Vous recevez une aide directe sur toute question de configuration.']
    ];
    const cats = ['tout', 'La base', 'Commande', 'Licence', 'Support'];
    const cat = this.state.cat;
    const list = all.map(([c, q, a], i) => ({ c, q, a, i })).filter((x) => cat === 'tout' || x.c === cat);
    return {
      cats: cats.map((c) => ({ label: c === 'tout' ? 'Tout' : c, pressed: c === cat ? 'true' : 'false', pick: () => this.setState({ cat: c, open: -1 }) })),
      items: list.map((x) => {
        const open = this.state.open === x.i;
        return { cat: x.c, q: x.q, a: x.a, open, expanded: open ? 'true' : 'false', rot: open ? '45' : '0', sBg: open ? '#16151A' : '#FFFFFF', sFg: open ? '#FFFFFF' : '#16151A', sBd: open ? '#16151A' : '#D3CFC7', border: open ? '#D3CFC7' : '#E3E0DA', toggle: () => this.setState({ open: open ? -1 : x.i }) };
      })
    };
  }
}
</script>
</body>
</html>
